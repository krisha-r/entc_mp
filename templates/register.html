{% extends "base.html" %} {% block content %}
<h2 class="bolded" style="text-align: center">Create A New Account</h2>
<p style="text-align: center">
  Already registered?
  <a href="/login">Log In</a>
</p>
<form action="/register" method="post">
  <label>Username: </label>
  <input type="text" name="username" id="username" maxlenght="25" required />
  <label>Password: </label>
  <input
    type="password"
    name="password"
    id="password"
    minlength="8"
    maxlenght="25"
    required
    pattern="(?=.*[!@#$%^&*_\-]).{8,}"
    title="Must contain at least one special character (!@#$%^&*_-) and be at least 8 characters long."
  />
  <p>*password is case-sensitive</p>
  <label>Date of Birth:</label>
  <input type="date" name="dob" id="dob" required />

  <input type="submit" value="Register" />
</form>
{%endblock%}
